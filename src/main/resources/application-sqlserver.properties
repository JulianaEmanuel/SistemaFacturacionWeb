app.sqlserver.database-name=${DB_NAME:SistemaFacturacionWeb}
spring.datasource.url=jdbc:sqlserver://${DB_SERVER:127.0.0.1}:${DB_PORT:1433};databaseName=${app.sqlserver.database-name};integratedSecurity=true;authenticationScheme=NativeAuthentication;encrypt=true;trustServerCertificate=${app.sqlserver.trust-server-certificate:false}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false
