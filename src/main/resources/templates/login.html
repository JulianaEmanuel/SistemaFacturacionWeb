<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión | Sistema de Facturación Web')}"></head>
<body class="bg-light">
<main class="container py-5" style="max-width:480px">
    <section class="card border-success shadow-sm p-4">
        <div class="text-success mb-3"><i class="bi bi-receipt-cutoff fs-1" aria-hidden="true"></i></div>
        <h1 class="h3">Sistema de Facturación Web</h1><p>Inicia sesión para acceder a tu espacio de trabajo.</p>
        <div th:if="${param.error}" class="alert alert-danger" role="alert">No se pudo iniciar sesión. Comprueba tus credenciales y el estado de tu cuenta.</div>
        <div th:if="${param.logout}" class="alert alert-success" role="status">Sesión cerrada correctamente.</div>
        <div th:if="${param.expired}" class="alert alert-warning" role="status">Tu sesión ya no está disponible. Inicia sesión nuevamente.</div>
        <form method="post" th:action="@{/login}">
            <div class="mb-3"><label class="form-label" for="username">Usuario</label><input class="form-control" id="username" name="username" maxlength="100" autocomplete="username" required autofocus></div>
            <div class="mb-3"><label class="form-label" for="password">Contraseña</label><input class="form-control" id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required></div>
            <button class="btn btn-success w-100" type="submit">Iniciar sesión</button>
        </form>
    </section>
</main>
</body>
</html>
