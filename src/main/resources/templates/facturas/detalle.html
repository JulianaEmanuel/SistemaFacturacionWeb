<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Detalle de factura | Sistema de Facturación Web')}"></head>
<body><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar('facturas')}"></aside><div class="app-main"><header th:replace="~{fragments/topbar :: topbar('Detalle de factura', 'GESTIÓN')}"></header>
<main class="content-area"><div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div><section class="page-intro"><h2 th:text="|Factura #${factura.id}|"></h2><p th:text="${#temporals.format(factura.fecha,'dd/MM/yyyy HH:mm:ss')}"></p></section>
<section class="cliente-panel p-4"><dl class="row"><dt class="col-sm-3">Cliente</dt><dd class="col-sm-9" th:text="${factura.cliente}"></dd><dt class="col-sm-3">Cédula</dt><dd class="col-sm-9" th:text="${factura.cedula}"></dd><dt class="col-sm-3">Empleado</dt><dd class="col-sm-9" th:text="${factura.empleado}"></dd></dl>
<div class="table-responsive"><table class="table align-middle"><thead><tr><th>Producto</th><th>Cantidad</th><th>Precio unitario</th><th>Tarifa IVA</th><th>Subtotal</th><th>IVA</th><th>Total</th></tr></thead><tbody><tr th:each="d : ${factura.lineas}"><td th:text="${d.nombre}"></td><td th:text="${d.cantidadVisible()}"></td><td th:text="${d.precioVisible()}"></td><td th:text="${d.porcentajeVisible()}"></td><td th:text="${d.subtotalVisible()}"></td><td th:text="${d.ivaVisible()}"></td><td th:text="${d.totalVisible()}"></td></tr><tr th:if="${#lists.isEmpty(factura.lineas)}"><td colspan="7">Esta factura histórica no contiene detalles.</td></tr></tbody></table></div>
<div class="text-end"><p>Subtotal: <strong th:text="${factura.subtotalVisible()}"></strong></p><p>IVA: <strong th:text="${factura.ivaVisible()}"></strong></p><p>Total: <strong th:text="${factura.totalVisible()}"></strong></p></div>
<p class="text-muted small">Los importes se muestran con dos decimales; el documento conserva cuatro decimales en sus cálculos almacenados.</p><div class="d-flex gap-2 d-print-none"><a class="btn btn-outline-secondary" th:href="@{/modulos/facturas}">Volver</a><button class="btn btn-outline-success" type="button" id="factura-imprimir">Imprimir</button></div></section></main>
</div></div><style>@media print { .sidebar,.topbar,.alert { display:none!important } .app-shell,.app-main { display:block!important;margin:0!important;padding:0!important;width:100%!important } .content-area { padding:0!important } .table-responsive { overflow:visible!important } .cliente-panel { border:0!important;box-shadow:none!important } }</style><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/app.js}"></script><script th:src="@{/js/facturas.js}"></script></body></html>
