<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${modoEdicion} ? 'Editar cliente | Sistema de Facturación Web' : 'Registrar cliente | Sistema de Facturación Web')}"></head>
<body>
	<div class="app-shell">
		<aside th:replace="~{fragments/sidebar :: sidebar('clientes')}"></aside>
		<div class="app-main">
			<header th:replace="~{fragments/topbar :: topbar(${modoEdicion} ? 'Editar cliente' : 'Registrar cliente', 'GESTIÓN DE CLIENTES')}"></header>
			<main class="content-area">
				<section class="page-intro" aria-labelledby="form-title">
					<p class="eyebrow">DATOS DE PERSONA</p>
					<h2 id="form-title" th:text="${modoEdicion} ? 'Editar cliente' : 'Registrar cliente'">Registrar cliente</h2>
					<p class="intro-copy">Los campos corresponden a las columnas existentes en dbo.Persona.</p>
				</section>
				<section class="cliente-panel cliente-form-panel">
					<form method="post" th:action="${formAction}" th:object="${personaForm}" novalidate>
						<div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert">Revisa los campos marcados antes de continuar.</div>
						<div class="cliente-form-grid">
							<div class="mb-3">
								<label class="form-label" for="cedulaPersona">Cédula <span class="required-mark">*</span></label>
								<input id="cedulaPersona" class="form-control" type="text" th:field="*{cedulaPersona}" inputmode="numeric" minlength="10" maxlength="10" pattern="[0-9]{10}" title="Ingrese exactamente 10 dígitos numéricos." autocomplete="off" required aria-describedby="cedula-error">
								<div id="cedula-error" class="field-error" th:if="${#fields.hasErrors('cedulaPersona')}" th:errors="*{cedulaPersona}"></div>
							</div>
							<div class="mb-3">
								<label class="form-label" for="fechaNacimientoPersona">Fecha de nacimiento</label>
								<input id="fechaNacimientoPersona" class="form-control" type="date" th:field="*{fechaNacimientoPersona}">
								<div class="field-hint">Campo opcional según la tabla dbo.Persona.</div>
							</div>
							<div class="mb-3">
								<label class="form-label" for="nombresPersona">Nombres <span class="required-mark">*</span></label>
								<input id="nombresPersona" class="form-control" type="text" th:field="*{nombresPersona}" maxlength="100" autocomplete="given-name" required aria-describedby="nombres-error">
								<div id="nombres-error" class="field-error" th:if="${#fields.hasErrors('nombresPersona')}" th:errors="*{nombresPersona}"></div>
							</div>
							<div class="mb-3">
								<label class="form-label" for="apellidosPersona">Apellidos <span class="required-mark">*</span></label>
								<input id="apellidosPersona" class="form-control" type="text" th:field="*{apellidosPersona}" maxlength="100" autocomplete="family-name" required aria-describedby="apellidos-error">
								<div id="apellidos-error" class="field-error" th:if="${#fields.hasErrors('apellidosPersona')}" th:errors="*{apellidosPersona}"></div>
							</div>
						</div>
						<div class="cliente-form-actions">
							<a class="btn btn-outline-secondary" th:href="@{/modulos/clientes}">Cancelar</a>
							<button class="btn btn-success" type="submit"><i class="bi bi-check2" aria-hidden="true"></i> <span th:text="${modoEdicion} ? 'Guardar cambios' : 'Registrar cliente'">Registrar cliente</span></button>
						</div>
					</form>
				</section>
			</main>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/app.js}"></script>
</body>
</html>
